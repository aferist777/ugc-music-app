<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UGC Music Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="top">
    <span class="brand">UGC Music Studio</span>
    <span class="top-sp"></span>
    <span class="fake-chip" id="fake-chip" hidden title="Free test runs: nothing paid is asked">FAKE</span>
    <button class="btn ghost" id="jobs-open" title="The journal of generations">Jobs</button>
    <button class="btn ghost" id="keys-open">API keys<span class="keys-dot" id="keys-dot" hidden></span></button>
    <button class="btn ghost" id="theme-toggle" title="Light or dark">Light</button>
  </header>

  <div class="app" id="app">
    <div class="upper">
      <aside class="library" id="library" aria-label="Library">
        <div class="pane-head">
          <span>Library</span>
          <span class="pane-tools">
            <button class="btn ghost s" id="lib-new-folder" title="A new folder in the open one">+ Folder</button>
            <button class="btn ghost s" id="lib-import" title="Bring pictures in from this computer (jpg, png, webp, gif)">Import</button>
            <input type="file" id="lib-import-input" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
          </span>
        </div>
        <div class="lib-tree" id="lib-tree" role="tree"></div>
        <div class="sash sash-h sash-in" id="sash-tree" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>
        <div class="lib-files-head">
          <span class="lib-crumb" id="lib-crumb"></span>
          <button class="btn link-s" id="lib-empty-archive" hidden>Empty archive</button>
          <span class="lib-sort">
            <button class="sort-btn" id="lib-sort-date" title="Newest first">Date</button>
            <button class="sort-btn" id="lib-sort-name" title="By name">Name</button>
          </span>
        </div>
        <div class="lib-files" id="lib-files" tabindex="0" role="listbox" aria-multiselectable="true"></div>
        <div class="player" id="player" hidden></div>
      </aside>

      <div class="sash sash-v" id="sash-lib" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

      <main class="work">
        <nav class="tabs" role="tablist" aria-label="Tools">
          <button class="tab" role="tab" data-tab="tags">Tags</button>
          <button class="tab" role="tab" data-tab="music">Music</button>
          <button class="tab" role="tab" data-tab="animate">Animate</button>
          <button class="tab" role="tab" data-tab="images">Images</button>
        </nav>
        <section class="panel tags" role="tabpanel" data-panel="tags">
          <aside class="tg-side">
            <button class="btn s tg-new" id="tg-new">+ New chat</button>
            <div class="tg-chats" id="tg-chats" role="list"></div>
          </aside>
          <div class="tg-main">
            <div class="tg-thread" id="tg-thread"></div>
            <form class="ask" id="tg-ask">
              <textarea class="ask-in" id="tg-input" rows="1" maxlength="4000" placeholder="Describe the music you want…"></textarea>
              <button class="btn primary" id="tg-send" type="submit">Send</button>
            </form>
          </div>
        </section>
        <section class="panel music" role="tabpanel" data-panel="music" hidden></section>
        <section class="panel" role="tabpanel" data-panel="animate" hidden>
          <div class="placeholder">
            <h2>Animate</h2>
            <p>A picture and a few words about the motion become a clip with Grok 1.5.</p>
          </div>
        </section>
        <section class="panel" role="tabpanel" data-panel="images" hidden>
          <div class="placeholder">
            <h2>Images</h2>
            <p>Models: in development.</p>
          </div>
        </section>
      </main>
    </div>

    <div class="sash sash-h sash-tl" id="sash-tl" role="separator" aria-orientation="horizontal" title="Drag to resize the timeline"></div>

    <section class="timeline" id="timeline" aria-label="Timeline">
      <div class="tl-head">
        <button class="btn icon ghost" id="tl-play" disabled title="Play">
          <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
        </button>
        <span class="tl-time" id="tl-time">0:00.0</span>
        <span class="tl-spacer"></span>
        <button class="btn s" id="tl-render" disabled title="Renders the video and the music into one file">Render</button>
      </div>
      <div class="tl-body">
        <div class="tl-names">
          <div class="tl-name tl-name-ruler"></div>
          <div class="tl-name">Video</div>
          <div class="tl-name">Audio 1</div>
          <div class="tl-name">Audio 2</div>
        </div>
        <div class="tl-lanes" id="tl-lanes">
          <div class="tl-ruler" id="tl-ruler"></div>
          <div class="tl-lane" data-lane="video"></div>
          <div class="tl-lane" data-lane="audio1"></div>
          <div class="tl-lane" data-lane="audio2"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="overlay" id="keys-overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="keys-title">
      <div class="dialog-head">
        <h2 id="keys-title">API keys</h2>
        <button class="btn icon ghost" id="keys-close" title="Close (Esc)">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form class="dialog-body" id="keys-form" autocomplete="off"></form>
      <div class="dialog-foot">
        <span class="dialog-msg" id="keys-msg" role="status"></span>
        <button class="btn primary" id="keys-save" type="submit" form="keys-form">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
